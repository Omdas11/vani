name: opentune
description: OpenTune — a Spotify-style music player for open-licensed music.
publish_to: 'none'
version: 1.6.2+11

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.42
  audio_service: ^0.18.18
  just_audio_background: ^0.0.1-beta.16
  http: ^1.2.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  file_picker: ^8.1.2
  google_fonts: ^6.0.0
  flutter_secure_storage: ^9.0.0
  saf: ^2.0.0
  dynamic_color: ^2.1.0
  material_color_utilities: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/veena_watermark.webp
